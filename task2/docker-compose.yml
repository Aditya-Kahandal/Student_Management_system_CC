networks:
  frontend:

services:
  web-app:
    container_name: web-app
    build: ./web-app
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    env_file: ./.env
    ports:
      - "80:5000"
    restart: unless-stopped
    healthcheck:
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request;
        urllib.request.urlopen('http://localhost:5000/health', timeout = 4).close()"]

  api:
    container_name: api
    build: ./api
    networks:
      - frontend
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
        interval: 15s
        timeout: 5s
        retries: 3
        start_period: 40s
        test: ["CMD", "python", "-c", "import urllib.request;
          urllib.request.urlopen('http://localhost:8080/health', timeout = 4).close()"]
