volumes:
  postgres-data:
  redis-data: 
  prometheus-data:
  grafana-data:
networks:
  frontend:
  backend:
  monitoring:
services:
  web-app:
    container_name: web-app
    build: ./web-app
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    env_file: ./.env
    ports:
      - "80:5000"
    restart: unless-stopped
    healthcheck:
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request;
        urllib.request.urlopen('http://localhost:5000/health', timeout = 4).close()"]

  api:
    container_name: api
    build: ./api
    networks:
      - frontend
      - backend
    ports:
      - "8080:8080"
    env_file: ./.env
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
      test: ["CMD", "python", "-c", "import urllib.request;
        urllib.request.urlopen('http://localhost:8080/health', timeout = 4).close()"]
  database:
    container_name: db
    image: postgres:18-alpine
    env_file: ./.env
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-scripts/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  pgweb:
    container_name: pgweb
    image: sosedoff/pgweb:0.17.0
    networks:
      - backend
    env_file: ./.env
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/info"]

  redis:
    container_name: redis
    image: redis:8-alpine
    env_file: ./.env
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--requirepass" ,"${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL","redis-cli -a \"$$REDIS_PASSWORD\" ping" ]
      interval: 10s
      timeout: 3s 
      retries: 3
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3
    volumes:
      - prometheus-data:/prometheus 
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - frontend
      - backend
      - monitoring
    restart: always
    healthcheck:
      test: ["CMD", "wget","--spider","http://localhost:9090/-/healthy"]
      interval: 30s
      retries: 3
      timeout: 10s
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
  
  grafana:
    container_name: grafana
    image: grafana/grafana:13.2-slim
    ports:
      - "3000:3000"
    networks:
      - monitoring
    env_file: ./.env
    restart: always
    healthcheck:
      test: ["CMD","wget", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      retries: 3
      timeout: 10s
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
  pgweb-exporter:
    container_name: pgweb-exporter
    image: prom/blackbox-exporter:v0.28.0
    restart: always
    networks:
      - backend
      - monitoring
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml
    healthcheck:
      test: ["CMD","wget", "--spider", "http://localhost:9115/metrics"]
      interval: 30s
      retries: 3
      timeout: 10s
  
  postgres-exporter:
    container_name: postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: always
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    env_file: ./.env
    healthcheck:
      test: ["CMD","wget", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      retries: 3
      timeout: 10s
  
  redis-exporter:
    container_name: redis-exporter
    image: oliver006/redis_exporter:v1.92.0-alpine
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    env_file: ./.env
    ports:
      - "9121"
    healthcheck:
      test: ["CMD","wget", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      retries: 3
      timeout: 10s