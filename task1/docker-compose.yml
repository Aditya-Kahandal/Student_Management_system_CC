services:
  web-app:
    container_name: web-app
    build: ./web-app
    env_file: ./.env
    ports:
      - "80:5000"
    restart: unless-stopped
    healthcheck:
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request;
        urllib.request.urlopen('http://localhost:5000/health', timeout = 4).close()"]